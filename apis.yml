name: OneStream
description: >-
  OneStream is an enterprise finance platform that unifies financial and
  operational data into a single source of truth, spanning financial close and
  consolidation, planning, budgeting, forecasting and financial planning &
  analysis (FP&A), account reconciliation, and reporting. It applies AI and
  machine learning to automate core finance work so teams can focus on analysis
  and decision-making. For developers and integrators OneStream exposes the
  OneStream Web (REST) API — a client-agnostic JSON-over-HTTPS service with
  Authentication, Data Management, and Data Provider endpoints — secured with
  bearer tokens (Personal Access Tokens via OneStream IdentityServer, or OAuth
  2.0 client_credentials through Microsoft Entra ID, Okta, or PingFederate) and
  extended through the Solution Exchange (MarketPlace, PartnerPlace, OpenPlace).
