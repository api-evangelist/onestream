apis:
- name: OneStream Web (REST) API
  description: >-
    RESTful JSON web service exposing OneStream Data Automation functions:
    Authentication, Data Management (ExecuteSequence, ExecuteStep), and Data
    Provider (ADO datasets from adapters, Cube Views, SQL, and method commands).
    Client-agnostic; POST + JSON; versioned via the api-version query parameter;
    bearer-token authentication.
